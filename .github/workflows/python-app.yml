# Run the test suite and linters on every supported Python version.
# Also callable from other workflows (e.g. the PyPI publish workflow).

name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[dev]"
    - name: Lint with flake8
      run: |
        flake8 . --count --max-complexity=10 --max-line-length=127 --show-source --statistics
    - name: Check formatting
      run: |
        black --check .
        isort --check .
    - name: Type check with mypy
      run: mypy --strict bme280pi tests
    - name: Test with pytest
      run: |
        python -m pytest
